<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#0B1F44"/>
  <meta name="description" content="Class Memories — A private social platform for school alumni. Share memories, chat, play games, and stay connected with your class forever."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="keywords" content="school memories, alumni, social network, class reunion, nostalgia"/>
  <meta property="og:title" content="Class Memories"/>
  <meta property="og:description" content="A digital home for school memories — Private social platform for our batch"/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/icons/icon-512.png"/>
  <title>Class Memories — Your School, Forever</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css"/>
  <link rel="stylesheet" href="/css/post-interactions.css"/>
</head>
<body class="bg-cream-100 text-navy-800 font-sans min-h-screen overflow-x-hidden">
  <!-- App-wide Background Watermark -->
  <img src="/assets/class-memories-logo.png" alt="" class="fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-72 h-72 object-contain opacity-[0.04] pointer-events-none z-0 mix-blend-multiply" />

  <!-- Animated Welcome Screen -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-black overflow-hidden flex items-center justify-center transition-opacity duration-1000">
    
    <!-- Campus Background (starts normal, scales up slowly) -->
    <div class="welcome-campus-bg absolute inset-0 bg-[url('/assets/campus-bg.png')] bg-cover bg-center transition-transform duration-[5000ms] ease-out scale-100"></div>

    <!-- The Magical Gates -->
    <div class="welcome-gates-container absolute inset-0 flex" style="perspective: 1500px;">
      <!-- Left Gate -->
      <div id="welcome-gate-left" class="w-1/2 h-full bg-[#0a1526] border-r-[3px] border-[#D4AF37] relative flex items-center justify-end transform-gpu origin-left transition-transform duration-[3000ms] ease-in-out shadow-[15px_0_40px_rgba(0,0,0,0.9)]">
        <!-- Details -->
        <div class="absolute inset-4 border border-[#D4AF37]/30 rounded-sm"></div>
        <div class="absolute inset-8 border-y border-l border-[#D4AF37]/20 flex items-center justify-center">
          <div class="w-16 h-64 border border-[#D4AF37]/40 rounded-t-full rounded-b-full"></div>
        </div>
        <!-- Handle -->
        <div class="w-2.5 h-20 bg-gradient-to-b from-[#B8860B] via-[#FFDF00] to-[#DAA520] rounded-l-lg mr-1.5 border-y border-l border-[#FFD700]/60 shadow-[0_0_10px_rgba(218,165,32,0.5)]"></div>
      </div>
      
      <!-- Right Gate -->
      <div id="welcome-gate-right" class="w-1/2 h-full bg-[#0a1526] border-l-[3px] border-[#D4AF37] relative flex items-center justify-start transform-gpu origin-right transition-transform duration-[3000ms] ease-in-out shadow-[-15px_0_40px_rgba(0,0,0,0.9)]">
        <!-- Details -->
        <div class="absolute inset-4 border border-[#D4AF37]/30 rounded-sm"></div>
        <div class="absolute inset-8 border-y border-r border-[#D4AF37]/20 flex items-center justify-center">
          <div class="w-16 h-64 border border-[#D4AF37]/40 rounded-t-full rounded-b-full"></div>
        </div>
        <!-- Handle -->
        <div class="w-2.5 h-20 bg-gradient-to-b from-[#B8860B] via-[#FFDF00] to-[#DAA520] rounded-r-lg ml-1.5 border-y border-r border-[#FFD700]/60 shadow-[0_0_10px_rgba(218,165,32,0.5)]"></div>
      </div>
    </div>

    <!-- Particles Layer -->
    <div id="welcome-particles" class="absolute inset-0 pointer-events-none z-[102] overflow-hidden"></div>
    
    <!-- Welcome Content (Fades in) -->
    <div id="welcome-content" class="welcome-content z-[103] flex flex-col items-center opacity-0 transform scale-95 transition-all duration-1000 ease-out mt-12">
      <img src="/assets/class-memories-logo.png" alt="Class Memories" class="w-36 h-36 drop-shadow-[0_0_30px_rgba(255,255,255,0.4)] mb-6"/>
      <h2 class="font-playfair text-4xl font-bold text-white tracking-wider mb-3 drop-shadow-[0_4px_12px_rgba(0,0,0,0.8)] text-center px-4">Class Memories</h2>
      <p class="font-caveat text-3xl text-[#FFDF00] drop-shadow-[0_2px_8px_rgba(0,0,0,0.9)] text-center px-4 font-semibold">"Every Memory Begins Here"</p>
    </div>
  </div>


  <!-- App Container -->
  <div id="app" class="hidden min-h-screen pb-20"></div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 shadow-nav safe-area-bottom">
    <div class="flex items-center justify-around py-1.5 px-2 max-w-lg mx-auto" id="nav-buttons"></div>
  </nav>

  <!-- Login Page -->
  <div id="login-page" class="hidden fixed inset-0 z-[90] bg-cream-100"></div>

  <!-- Call Overlay -->
  <div id="call-overlay" class="hidden fixed inset-0 z-[80]"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="z-[70]"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[200] space-y-2 max-w-xs"></div>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="hidden fixed bottom-20 left-0 right-0 z-[55]"></div>

  <script src="/js/security.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    // Force clear all old caches on unified SW migration (v3)
    (async function() {
      const BRAND_VERSION = 'cm-brand-v3';
      if (!localStorage.getItem(BRAND_VERSION)) {
        localStorage.setItem(BRAND_VERSION, '1');
        // Clear all service worker caches
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
          console.log('[ClassMemories] Cleared old caches for unified SW migration:', names);
        }
        // Unregister ALL old service workers (sw.js + old firebase-messaging-sw.js)
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
            console.log('[ClassMemories] Unregistered old SW:', reg.scope);
          }
        }
      }
      // Register the UNIFIED service worker (handles both caching + FCM push)
      // NOTE: firebase-messaging-sw.js is the SOLE service worker — do NOT also register sw.js
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/firebase-messaging-sw.js', { scope: '/' })
          .then(reg => console.log('[ClassMemories] Unified SW registered:', reg.scope))
          .catch(e => console.error('[ClassMemories] SW registration failed:', e));
      }
    })();
  </script>
</body>
</html>
