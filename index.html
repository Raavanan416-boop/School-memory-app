<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#0B1F44"/>
  <meta name="description" content="Class Memories — A private social platform for school alumni. Share memories, chat, play games, and stay connected with your class forever."/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="keywords" content="school memories, alumni, social network, class reunion, nostalgia"/>
  <meta property="og:title" content="Class Memories"/>
  <meta property="og:description" content="A digital home for school memories — Private social platform for our batch"/>
  <meta property="og:type" content="website"/>
  <meta property="og:image" content="/icons/icon-512.png"/>
  <title>Class Memories — Your School, Forever</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png"/>
  <link rel="manifest" href="/manifest.json"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Caveat:wght@500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/js/tailwind-config.js"></script>
  <link rel="stylesheet" href="/css/styles.css"/>
</head>
<body class="bg-cream-100 text-navy-800 font-sans min-h-screen overflow-x-hidden">
  <!-- Splash Screen -->
  <div id="splash-screen" class="fixed inset-0 z-[100] bg-cream-200 flex flex-col items-center justify-center transition-opacity duration-700">
    <div class="splash-logo-container">
      <div class="splash-logo-glow"></div>
      <img src="/assets/class-memories-logo.png" alt="Class Memories" class="splash-logo-img" />
    </div>
    <h2 class="splash-title-text">Class Memories</h2>
    <p class="splash-year-text">2024 & 2025</p>
    <p class="splash-tagline">"Relive the Golden Days"</p>
    <div class="mt-8 w-40 h-1.5 bg-cream-300 rounded-full overflow-hidden" style="opacity:0; animation: splashTextFade 1s ease-out 2s forwards;">
      <div id="splash-progress" class="h-full bg-navy-500 rounded-full transition-all duration-300" style="width:0%"></div>
    </div>
  </div>


  <!-- App Container -->
  <div id="app" class="hidden min-h-screen pb-20"></div>

  <!-- Bottom Navigation -->
  <nav id="bottom-nav" class="hidden fixed bottom-0 left-0 right-0 z-50 bg-white border-t border-gray-100 shadow-nav safe-area-bottom">
    <div class="flex items-center justify-around py-1.5 px-2 max-w-lg mx-auto" id="nav-buttons"></div>
  </nav>

  <!-- Login Page -->
  <div id="login-page" class="hidden fixed inset-0 z-[90] bg-cream-100"></div>

  <!-- Call Overlay -->
  <div id="call-overlay" class="hidden fixed inset-0 z-[80]"></div>

  <!-- Modal Container -->
  <div id="modal-container" class="z-[70]"></div>

  <!-- Toast Container -->
  <div id="toast-container" class="fixed top-4 right-4 z-[200] space-y-2 max-w-xs"></div>

  <!-- PWA Install Banner -->
  <div id="pwa-install-banner" class="hidden fixed bottom-20 left-0 right-0 z-[55]"></div>

  <script src="/js/security.js"></script>
  <script type="module" src="/js/app.js"></script>
  <script>
    // Force clear all old caches on icon branding update (v2)
    (async function() {
      const BRAND_VERSION = 'cm-brand-v2';
      if (!localStorage.getItem(BRAND_VERSION)) {
        localStorage.setItem(BRAND_VERSION, '1');
        // Clear all service worker caches
        if ('caches' in window) {
          const names = await caches.keys();
          await Promise.all(names.map(name => caches.delete(name)));
          console.log('[ClassMemories] Cleared old caches for branding update:', names);
        }
        // Unregister old service workers so they re-register fresh
        if ('serviceWorker' in navigator) {
          const regs = await navigator.serviceWorker.getRegistrations();
          for (const reg of regs) {
            await reg.unregister();
            console.log('[ClassMemories] Unregistered old SW');
          }
        }
      }
      // Register service worker
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').catch(e => console.log('SW:', e));
      }
    })();
  </script>
</body>
</html>
